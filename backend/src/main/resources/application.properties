spring.application.name=uninex
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/uninex}
server.port=${PORT:8080}

# Google OAuth2 login (Issue #5). Real credentials come from environment
# variables so they never live in source control or in this chat -- the
# demo-* fallback lets the app and its tests boot without them, but login
# will only actually work once GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET are
# set to real values from Google Cloud Console (see README "Auth setup").
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:demo-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:demo-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile

# Origin(s) allowed to call this API with credentials (comma-separated).
# Defaults to the local Vite dev server; set FRONTEND_URL in production to
# the real deployed frontend origin (see SecurityConfig).
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
